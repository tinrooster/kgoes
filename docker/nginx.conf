server {
    # Studioshare egress proxy binds :80; app listens on 8080 (same as trackIT).
    # IPv4 only here — entrypoint socat bridges [::1]:8080 → 127.0.0.1:8080 for sidecar health checks.
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /build-info.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /build-info.json =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
