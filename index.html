    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "KGO-ES",

  </head>
  <body>
    <script>
      (function() {
        var stored = localStorage.getItem('easyschematic-theme');
        var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-ti', '');
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-density', 'comfortable');
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <h1>KGO-ES — Plant engineering schematics for trackIT</h1>
      <p>Signal flow diagrams, rack elevations, and print sheets linked to trackIT plant drawings.</p>
      <p>Built for KGO broadcast engineering.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
