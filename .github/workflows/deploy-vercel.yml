name: Deploy to Vercel (kgoes)

# Deploys to kgoes.vercel.app only after a clean build.
# Vercel's GitHub auto-deploy integration must be disabled so this workflow
# is the sole deploy path — otherwise Vercel races CI and may deploy a broken build.
#
# Required repository secrets:
#   VERCEL_TOKEN        — Vercel personal access token (vercel.com/account/tokens)
#   VERCEL_ORG_ID       — from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID   — from .vercel/project.json after `vercel link`

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies
        run: cd api && npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
